org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# --- Böbrek Dostu: yavaş/kopan bağlantılarda takılmayı önler ---
# Gradle'ın varsayılan HTTP okuma zaman aşımı çok uzundur; ağ idle
# bağlantıları sessizce düşürdüğünde indirme sonsuza kadar bekler
# (daemon log'u durur, soketler açık kalır, ilerleme olmaz).
# Açık zaman aşımı + daha az paralel indirme bunu çözer.
systemProp.org.gradle.internal.http.connectionTimeout=60000
systemProp.org.gradle.internal.http.socketTimeout=60000
org.gradle.workers.max=4

# mobile_scanner: barkod modelini APK'ya GÖMME, Google Play hizmetlerinden
# al. Gömülü sürüm libbarhopper_v3.so (4,7 MB) + model varlıkları (0,8 MB)
# ekliyordu. Ayrık sürümde model ilk kullanımda cihaza iner ve diğer
# uygulamalarla paylaşılır.
# Karşılığı: Play hizmetleri olmayan cihazda barkod taranamaz — uygulama
# bu durumu yakalayıp kullanıcıdan kodu elle girmesini ister.
dev.steenbakker.mobile_scanner.useUnbundled=true
